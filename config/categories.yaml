# 카테고리 정의 (SPEC FR-1, D3, D9)
#
# 카테고리 = 대분류(parent) × 태그(국내/해외) 조합. 예: food × overseas = `food_overseas`
# 코드 수정 없이 이 파일만 고쳐 카테고리를 추가할 수 있어야 한다 (확장형 체계).
#
# 태그는 채널 국적이 아니라 **소재 구분**이다 (D9). 추적 대상은 한국(한국어) 채널로 한정하며,
# 해외 키워드가 잡히면 overseas, 아니면 domestic으로 본다.
#
# weight: 키워드가 겹치는 소재에서 우선순위를 가른다 (예: 'AI 코딩' → tech가 아닌 aicoding).

