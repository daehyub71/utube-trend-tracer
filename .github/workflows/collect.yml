name: Collect

# 하루 3회 수집 (KST 기준 09:00 / 17:00 / 01:00).
# 예약 실행은 수십 분 늦을 수 있다 — 점수는 스냅샷 실측 시각으로 계산하므로 (FR-7)
# 지연이 랭킹을 왜곡하지 않는다.
on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

# 상황판 갱신 커밋을 위해 쓰기가 필요하다 — 그 외 권한은 주지 않는다.
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect and score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      # 카테고리 정의는 YAML이 단일 진실 — 매 주기 반영해 코드 배포 없이 갱신되게 한다.
      - name: Sync category config
        run: python -m scripts.sync_config

      - name: Collect snapshots
        run: python -m scripts.run_collect

      # 수집이 일부 실패해도 직전 스냅샷으로 랭킹은 갱신한다 (NFR-7).
      - name: Compute rankings
        if: always()
        run: python -m scripts.run_scoring

      # RSS 검증은 쿼터를 쓰지 않는다 — 매 주기 돌려도 비용이 없다.
      - name: Verify seed feeds
        if: always()
        run: python -m scripts.verify_seeds --json ../docs/reports/rss_verify.json || true

      # 상황판은 장애 상황일수록 필요하므로, 앞 단계가 실패해도 생성한다 (NFR-9).
      - name: Build ops report
        if: always()
        run: python -m scripts.build_report

      - name: Commit ops report
        if: always()
        working-directory: .
        run: |
          # 산출물은 키·연락처를 담지 않는다 (NFR-10, D13).
          if grep -rqiE "eyJ[A-Za-z0-9_-]{10,}|AIza[A-Za-z0-9_-]{10,}" docs/reports/; then
            echo "::error::상황판 산출물에 시크릿으로 보이는 문자열이 있습니다. 커밋을 중단합니다."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/
          git diff --staged --quiet || git commit -m "chore: update ops report [skip ci]"
          git push
